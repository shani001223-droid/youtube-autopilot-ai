name: Analytics and learning
on:
  schedule:
    - cron: "41 6 * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: autopilot-state
  cancel-in-progress: false
jobs:
  analytics:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      HAS_YT: ${{ secrets.YT_REFRESH_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main # get current state after acquiring the concurrency lock
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Weekly plan
        run: python -m autopilot plan
      - name: Pull analytics, retention, insights, audit
        if: env.HAS_YT == 'true'
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
        run: python -m autopilot analytics
      - name: Draft comment replies (never posted automatically)
        if: env.HAS_YT == 'true'
        continue-on-error: true
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
        run: python -m autopilot comments
      - name: Hindi and English channel analytics (separate credentials)
        env:
          YT_HINDI_CLIENT_ID: ${{ secrets.YT_HINDI_CLIENT_ID }}
          YT_HINDI_CLIENT_SECRET: ${{ secrets.YT_HINDI_CLIENT_SECRET }}
          YT_HINDI_REFRESH_TOKEN: ${{ secrets.YT_HINDI_REFRESH_TOKEN }}
          YT_HINDI_CHANNEL_ID: ${{ vars.YT_HINDI_CHANNEL_ID }}
          YT_ENGLISH_CLIENT_ID: ${{ secrets.YT_ENGLISH_CLIENT_ID }}
          YT_ENGLISH_CLIENT_SECRET: ${{ secrets.YT_ENGLISH_CLIENT_SECRET }}
          YT_ENGLISH_REFRESH_TOKEN: ${{ secrets.YT_ENGLISH_REFRESH_TOKEN }}
          YT_ENGLISH_CHANNEL_ID: ${{ vars.YT_ENGLISH_CHANNEL_ID }}
        run: |
          rc=0
          if [ -n "$YT_HINDI_REFRESH_TOKEN" ]; then python -m autopilot analytics --profile hindi_shorts || rc=1; fi
          if [ -n "$YT_ENGLISH_REFRESH_TOKEN" ]; then python -m autopilot analytics --profile english_long || rc=1; fi
          exit "$rc"
      - name: Save state
        if: always()
        run: |
          git config user.name "autopilot-bot"
          git config user.email "autopilot-bot@users.noreply.github.com"
          git add data
          git diff --cached --quiet || { git commit -m "state: analytics run ${{ github.run_id }}"; git pull --rebase --autostash; git push; }
