name: Generate video
on:
  push:
    branches: [main]
    paths: [".github/workflows/generate.yml"] # smoke run after pipeline workflow upgrades
  schedule:
    - cron: "17 3 * * *"          # Hindi Shorts, 08:17 PKT
    - cron: "43 12 * * *"         # Hindi Shorts, 17:43 PKT
    - cron: "27 8 * * 2,6"        # English long, Tue/Sat 13:27 PKT
  workflow_dispatch:
    inputs:
      profile:
        description: "Channel preview profile (manual review only for new channels)"
        type: choice
        options: [legacy, hindi_shorts, english_long]
        default: legacy
      demo:
        description: "Smoke test: fake script, tone voice, generated visuals. Uses no API keys."
        type: boolean
        default: false
permissions:
  contents: write                 # commits state to data/ and creates the preview release
concurrency:
  group: autopilot-state
  cancel-in-progress: false
jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        profile: ${{ fromJSON(github.event_name == 'push' && '["hindi_shorts","english_long"]' || github.event.schedule == '27 8 * * 2,6' && '["english_long"]' || github.event_name == 'schedule' && '["hindi_shorts"]' || format('["{0}"]', inputs.profile || 'legacy')) }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main # get current state after acquiring the concurrency lock
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: System packages
        run: sudo apt-get update -y && sudo apt-get install -y ffmpeg fonts-dejavu-core fonts-noto-core espeak-ng
      - name: Python packages
        env:
          DEMO: ${{ inputs.demo }}
        run: |
          pip install -r requirements.txt
          if [ "$DEMO" != "true" ]; then pip install -r requirements-voice.txt; fi
      - name: Recovery and visual regression tests
        run: python -m unittest tests.test_llm tests.test_recovery tests.test_visual_sources tests.test_scriptgen tests.test_research tests.test_cinematic_upgrade tests.test_channel_profiles tests.test_production -v
      - name: Cache Piper voices
        uses: actions/cache@v4
        with:
          path: voices
          key: piper-voices-v1
      - name: Generate
        id: gen
        env:
          PROFILE: ${{ matrix.profile }}
          EVENT: ${{ github.event_name }}
          GEMINI_TTS_MODEL: ${{ vars.GEMINI_TTS_MODEL }}
          GEMINI_IMAGE_MODEL: ${{ vars.GEMINI_IMAGE_MODEL }}
          ALLOW_PAID_IMAGE_API: ${{ vars.ALLOW_PAID_IMAGE_API }}
          AI_IMAGE_MAX_CALLS: ${{ vars.AI_IMAGE_MAX_CALLS }}
          DEMO: ${{ inputs.demo }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
        run: |
          ARGS=""
          if [ "$DEMO" = "true" ]; then ARGS="--demo"; fi
          if [ "$EVENT" != "workflow_dispatch" ]; then ARGS="$ARGS --scheduled"; fi
          python -m autopilot generate --profile "$PROFILE" $ARGS
      - name: Publish preview (GitHub Release, deleted after review)
        if: steps.gen.outputs.STATUS == 'awaiting_approval'
        env:
          GH_TOKEN: ${{ github.token }}
          ITEM_ID: ${{ steps.gen.outputs.ITEM_ID }}
        run: |
          TAG="preview-$ITEM_ID"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "out/$ITEM_ID/video.mp4" "out/$ITEM_ID/thumb.jpg" --clobber
          else
            gh release create "$TAG" "out/$ITEM_ID/video.mp4" "out/$ITEM_ID/thumb.jpg" --title "Preview $ITEM_ID" --notes "Review copy for the dashboard." --prerelease
          fi
          gh release view "$TAG" --json assets --jq '.assets[] | select(.name == "video.mp4" and .size > 0) | .name' | grep -qx video.mp4
          BASE="https://github.com/${{ github.repository }}/releases/download/$TAG"
          python -m autopilot set-preview --id "$ITEM_ID" --url "$BASE/video.mp4" --thumb-url "$BASE/thumb.jpg"
      - name: Save state
        if: always()
        run: |
          git config user.name "autopilot-bot"
          git config user.email "autopilot-bot@users.noreply.github.com"
          git add data
          git diff --cached --quiet || { git commit -m "state: generate run ${{ github.run_id }}"; git pull --rebase --autostash; git push; }
